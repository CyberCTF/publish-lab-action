name: Publish CyberCTF lab
description: >-
  Register the lab in the calling repository with CyberCTF. The endpoints live here (not in the
  public lab repos), and the lab's own metadata is treated as untrusted input: it is validated,
  the slug is forced to the repository name, and the repository and commit come from the trusted
  GitHub context, never from the lab. Gate the job behind an environment with required reviewers.
inputs:
  client_id:
    description: CyberAuth OAuth client id (a labs:publish client). Pass an org secret.
    required: true
  client_secret:
    description: CyberAuth OAuth client secret. Pass an org secret.
    required: true
  allowed_owner:
    description: Only publish labs from this GitHub owner. A repo under another owner is refused.
    required: false
    default: CyberCTF
  backend_url:
    description: CyberBackend base URL. Pass an org secret so it never appears in a lab repo or log.
    required: true
  token_url:
    description: CyberAuth token endpoint. Pass an org secret.
    required: true
  publish:
    description: >-
      "true" puts the lab in the catalogue once its registration is approved (the environment's
      reviewers are the gate); "false" registers it as a draft. Cloud labs stay drafts either way
      until the launcher runs them.
    required: false
    default: "true"
  isothrum_version:
    description: >-
      The Isothrum runner release this lab was validated against (the version the CI pins), as a
      semantic version like 0.11.0. Recorded as the minimum runner a launcher needs to run the lab.
    required: true
  isoloom_bin:
    description: >-
      The isoloom CLI to read the spec format and version from (`isoloom validate --json`).
      Defaults to `isoloom` on PATH; the lab's generate step must have installed it.
    required: false
    default: isoloom
runs:
  using: node20
  main: index.js
